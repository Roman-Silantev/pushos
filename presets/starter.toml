# PushOS starter configuration.
#
# This file is the source of truth. PushOS Studio edits it; nothing is hidden
# in a database, and closing Studio changes nothing.
#
# Everything is written as:
#
#     control + gesture (+ page or workspace) -> action
#
# A control is a name, never a MIDI number. Run `pushos check` after editing.

[runtime]
# The page PushOS starts on, and the one `page.home` returns to.
home_page = "home"

# The application media actions control. Anything scriptable will do.
media_player = "Music"

# Where agents and terminals work when nothing else says. A leading ~ expands.
# workspace_root = "~/Projects"

# What a terminal runs when a binding does not name a program. Defaults to your
# own shell.
# shell = "/bin/zsh"

[gestures]
# A press held this long is a hold rather than a tap.
hold_threshold_ms = 400
# Two taps closer together than this are a double tap. Must be shorter than the
# hold threshold, or a slow double tap would be indistinguishable from a hold.
double_tap_window_ms = 280

[permissions]
# Nothing is permitted unless it is listed here. There is no wildcard.
# Add "shell.execute" only when you have shell bindings you trust.
granted = [
    "media.control",
    "application.launch",
    "shortcuts.execute",
]

# --- Agents ------------------------------------------------------------------
# An agent is a role, not a process. Which provider fills it can change without
# any binding changing, and a binding names the role rather than a session.
#
# Uncomment a provider to make agents available. PushOS knows how to start the
# two adapters below, so naming one is enough; it will not start a subprocess
# you never mentioned. Add `program` and `args` for anything else that speaks
# the Agent Client Protocol.
#
# Agent actions need "shell.execute" in the permissions above, because an agent
# runs commands on your behalf.

# [[providers]]
# id = "claude"

# [[providers]]
# id = "codex"

# [[agents]]
# id = "builder"
# name = "Builder"
# objective = "Implement approved development work safely and concisely."
# preferred = ["claude"]
# permissions = ["filesystem.read", "filesystem.write", "shell.execute"]

# [[agents]]
# id = "reviewer"
# name = "Reviewer"
# objective = "Review what changed and report only what matters."
# preferred = ["codex"]
# permissions = ["filesystem.read"]

# A pad that talks to a role. Tap starts or selects it; hold sends a prompt.
#
# [[bindings]]
# control = "pad.16"
# gesture = "tap"
# page = "development"
# action = "agent.start"
# target = "role:builder"
# label = "Builder"
#
# One approve pad serves every agent, because a binding with no target acts on
# whichever session you last chose.
#
# [[bindings]]
# control = "button.upper_8"
# gesture = "press"
# action = "agent.approve"
# label = "Approve"

# --- Projects ----------------------------------------------------------------
# A project is what a pad means when it says "Sydclaw": where work happens,
# what opens it, who fills each role there, and where the surface should be on
# arrival. One pad can then represent the whole thing.
#
# Selecting a project brings its bindings into force, starts agents and
# terminals in its directory, and puts you back on the page you were last on.
#
# [[workspaces]]
# id = "sydclaw"
# name = "Sydclaw"
# root = "~/Projects/sydclaw"
# home_page = "development"

# The applications this project opens in, by the name a binding uses.
#
# [workspaces.apps]
# Cursor = "~/Projects/sydclaw"

# Which provider fills each role here. The same role can be one agent in one
# project and another elsewhere, which is why a binding names the role.
#
# [workspaces.roles]
# builder = "claude"

# Environment given to everything started in this project.
#
# [workspaces.env]
# PROJECT = "sydclaw"

# A project that runs several coding agents should give each its own working
# tree. Two of them editing one checkout produce a conflict nobody can untangle.
# The project must be a git repository for this.
#
# [[workspaces]]
# id = "pushos"
# name = "PushOS"
# root = "~/Projects/pushos"
# isolate_agents = true

# One pad, one project. Hold it to open the project in an application.
#
# [[bindings]]
# control = "button.upper_5"
# gesture = "press"
# action = "workspace.select"
# target = "sydclaw"
# label = "Sydclaw"
#
# [[bindings]]
# control = "button.upper_5"
# gesture = "hold"
# action = "workspace.open"
# label = "Open"
# [bindings.params]
# app = "Cursor"

# A binding scoped to a project only fires while that project is selected, so
# the same pad can mean something different in each one.
#
# [[bindings]]
# control = "pad.32"
# gesture = "tap"
# workspace = "sydclaw"
# action = "terminal.run"
# target = "name:tests"
# label = "Sydclaw tests"
# [bindings.params]
# text = "npm test"

# --- Terminals ---------------------------------------------------------------
# PushOS runs terminals itself rather than opening windows. They start with
# nothing appearing on screen, keep running when nothing is looking, and a pad
# that means "the test run" means it whether or not a window exists.
#
# Nothing needs declaring: a terminal is created by the binding that opens it,
# and named there. Every terminal action needs "shell.execute" in the
# permissions above, because a terminal runs whatever is typed into it.
#
# Tap to open the terminal called "tests". Pressing it again selects the one
# already running rather than starting a second.
#
# [[bindings]]
# control = "pad.24"
# gesture = "tap"
# page = "development"
# action = "terminal.open"
# label = "Tests"
# [bindings.params]
# name = "tests"

# Hold the same pad to run the tests in it. `terminal.run` types a line and
# presses return; `terminal.send` types exactly what it is given, which is how
# a single key answers a prompt.
#
# [[bindings]]
# control = "pad.24"
# gesture = "hold"
# page = "development"
# action = "terminal.run"
# target = "name:tests"
# label = "Run tests"
# [bindings.params]
# text = "cargo test"

# One stop pad serves every terminal, because a binding with no target acts on
# whichever one you last chose.
#
# [[bindings]]
# control = "button.upper_7"
# gesture = "press"
# action = "terminal.close"
# label = "Stop"

# --- Workflows ---------------------------------------------------------------
# A workflow is work that runs itself: plan, then build, then test, then review,
# with somewhere to go when the tests fail. One pad starts it and it carries on
# without anyone watching.
#
# A step is written down before the step after it runs, so a workflow survives
# PushOS stopping. A run waiting on a person is still waiting when it comes back.
#
# Starting one needs "shell.execute", because its steps run agents and commands
# on your behalf. Answering one does not.
#
# [[workflows]]
# id = "ship"
# name = "Ship"
# start = "plan"
# max_steps = 40
# timeout_seconds = 3600

# Ask a role to do something and wait for it to finish the turn.
#
# [[workflows.nodes]]
# id = "plan"
# kind = "agent"
# agent = "builder"
# prompt = "Make the change we discussed, then stop."
# next = "tests"

# Run a program and wait for it to exit. Program and arguments stay separate,
# as everywhere else, and the terminal runs the program itself so that its exit
# status is the command's.
#
# [[workflows.nodes]]
# id = "tests"
# kind = "terminal"
# terminal = "tests"
# program = "cargo"
# args = ["test", "--workspace"]
# next = "ask"
# on_failure = "again?"

# Loops need a way out. `attempts` is how many steps this run has taken, so a
# retry that never succeeds still ends.
#
# [[workflows.nodes]]
# id = "again?"
# kind = "condition"
# check = "attempts"
# limit = 12
# then = "plan"
# otherwise = "gave_up"

# The one step that stops for a person. Put one in front of anything you would
# not want done while you were out of the room.
#
# [[workflows.nodes]]
# id = "ask"
# kind = "approval"
# question = "Tests passed. Ship it?"
# approve = "shipped"
# reject = "gave_up"

# [[workflows.nodes]]
# id = "shipped"
# kind = "end"
# outcome = "succeeded"

# [[workflows.nodes]]
# id = "gave_up"
# kind = "end"
# outcome = "failed"

# One pad starts it. One approve pad serves every workflow, because a binding
# with no run named answers whichever one is asking.
#
# [[bindings]]
# control = "pad.40"
# gesture = "tap"
# action = "workflow.start"
# target = "ship"
# label = "Ship"
#
# [[bindings]]
# control = "button.upper_6"
# gesture = "press"
# action = "workflow.approve"
# label = "Approve"

# --- Pages -------------------------------------------------------------------
# A page changes what the controls mean. Bindings reference a page by id.

[[pages]]
id = "home"
name = "Home"
description = "Transport, pages and the things you reach for constantly"

[[pages]]
id = "development"
name = "Development"
description = "Projects, editors and test runs"

[[pages]]
id = "music"
name = "Music"
description = "Playback and volume"

# --- The display row ---------------------------------------------------------
# The eight buttons above the display and the eight below it line up with the
# eight columns on screen, so each column shows what its two buttons do. Only
# bindings with a `label` are shown: an action selector is not a caption.

[[bindings]]
control = "button.upper_1"
gesture = "press"
action = "page.show"
target = "home"
label = "Home"

[[bindings]]
control = "button.upper_2"
gesture = "press"
action = "page.show"
target = "development"
label = "Develop"

[[bindings]]
control = "button.upper_3"
gesture = "press"
action = "page.show"
target = "music"
label = "Music"

[[bindings]]
control = "button.lower_1"
gesture = "press"
action = "media.play_pause"
label = "Play/Pause"

[[bindings]]
control = "button.lower_3"
gesture = "press"
action = "media.now_playing"
label = "Now playing"

# --- Global bindings ---------------------------------------------------------
# These apply on every page. Keep them few: they cost a control everywhere.

[[bindings]]
control = "button.play"
gesture = "press"
action = "media.play_pause"
label = "Play/Pause"

[[bindings]]
control = "button.page_right"
gesture = "press"
action = "page.next"
label = "Next page"

[[bindings]]
control = "button.page_left"
gesture = "press"
action = "page.previous"
label = "Previous page"

[[bindings]]
control = "button.session"
gesture = "press"
action = "page.home"
label = "Home"

# --- Home page ---------------------------------------------------------------

[[bindings]]
control = "pad.0"
gesture = "tap"
page = "home"
action = "page.show"
target = "development"
label = "Development"

[[bindings]]
control = "pad.1"
gesture = "tap"
page = "home"
action = "page.show"
target = "music"
label = "Music"

# --- Development page --------------------------------------------------------

[[bindings]]
control = "pad.0"
gesture = "tap"
page = "development"
action = "app.launch"
target = "Cursor"
label = "Cursor"

[[bindings]]
control = "pad.1"
gesture = "tap"
page = "development"
action = "app.launch"
target = "Terminal"
label = "Terminal"

# A hold on the same pad can mean something else entirely. The recogniser
# arms a timer only for controls that need one, so a tap stays immediate.
[[bindings]]
control = "pad.0"
gesture = "hold"
page = "development"
action = "app.open_url"
target = "https://github.com/Roman-Silantev/pushos"
label = "Open the repository"

# --- Music page --------------------------------------------------------------

[[bindings]]
control = "pad.0"
gesture = "tap"
page = "music"
action = "media.play_pause"
label = "Play/Pause"

[[bindings]]
control = "pad.1"
gesture = "tap"
page = "music"
action = "media.previous_track"
label = "Previous"

[[bindings]]
control = "pad.2"
gesture = "tap"
page = "music"
action = "media.next_track"
label = "Next"

[[bindings]]
control = "pad.3"
gesture = "tap"
page = "music"
action = "media.now_playing"
label = "Now playing"

[[bindings]]
control = "encoder.master"
gesture = "turn_right"
page = "music"
action = "media.volume_up"
label = "Volume up"

[[bindings]]
control = "encoder.master"
gesture = "turn_left"
page = "music"
action = "media.volume_down"
label = "Volume down"
