label = "Home folder"

[[bindings]]
control = "button.upper_8"
gesture = "press"
page = "automation"
action = "page.back"
label = "Back"

# --- What is running on this machine -----------------------------------------
# The coding sessions you already have open, without configuring anything.
# PushOS reads what each terminal window is working on and puts it on the pads:
# green is waiting for you, blue is working, purple has a line typed and not
# sent, amber is asking you something.
#
# It did not start these and does not own them, so it can watch them and type
# into them and nothing else. The first time you run it macOS asks whether
# PushOS may control Terminal; that permission is what makes this work, and
# `pushos doctor` reports on it.

[[pages]]
id = "running"
name = "Running"
description = "Every coding session open on this machine, and what it is doing"

# Eight pads, however many sessions. The arrows and the leftmost encoder move
# which eight are in view.

[[bindings]]
control = "button.right"
gesture = "press"
page = "running"
action = "session.bank"
label = "Next eight"
params = { by = 1 }

