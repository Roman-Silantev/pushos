# --- Development page --------------------------------------------------------
# Terminals PushOS runs itself. A tap opens one, and pressing again selects the
# one already running rather than starting a second.

[[bindings]]
control = "pad.0"
gesture = "tap"
page = "development"
action = "terminal.open"
label = "Tests"
params = { name = "tests" }

[[bindings]]
control = "pad.0"
gesture = "hold"
page = "development"
action = "terminal.run"
target = "name:tests"
label = "Run tests"
params = { text = "cargo test" }

[[bindings]]
control = "pad.1"
gesture = "tap"
page = "development"
action = "terminal.open"
label = "Build"
params = { name = "build" }

[[bindings]]
control = "pad.1"
gesture = "hold"
page = "development"
action = "terminal.run"
target = "name:build"
label = "Build"
params = { text = "cargo build" }

[[bindings]]
control = "pad.2"
gesture = "tap"
page = "development"
action = "terminal.open"
label = "Shell"
params = { name = "shell" }

[[bindings]]
control = "pad.8"
gesture = "tap"
page = "development"
action = "shell.run"
label = "Status"
params = { program = "git", args = ["status", "--short"] }

[[bindings]]
control = "pad.9"
gesture = "tap"
page = "development"
action = "shell.run"
label = "Fetch"
params = { program = "git", args = ["fetch", "--all"] }

# A double tap on the terminal pad closes it, because a single tap is how you
# select one and closing by accident is worse than closing slowly.
[[bindings]]
control = "pad.0"
gesture = "double_tap"
page = "development"
action = "terminal.close"
target = "name:tests"
label = "Close tests"

# --- Agents page -------------------------------------------------------------
# Bindings are here and ready. Add an agent role and a provider under
# `[[agents]]` and `[[providers]]` and they start working; until then the
# namespace is not offered and these pads say so rather than doing something
# unexpected.

[[bindings]]
control = "button.upper_8"
gesture = "press"
page = "agents"
action = "page.back"
label = "Back"

[[bindings]]
control = "pad.56"
gesture = "tap"
page = "agents"
action = "page.home"
label = "Home"

# --- Projects page -----------------------------------------------------------
# Add a `[[workspaces]]` entry and a `workspace.select` binding here, and one
# pad becomes a whole codebase: its bindings, its agents, its terminals and the
# page you were last on.

[[bindings]]
control = "button.upper_8"
gesture = "press"
page = "projects"
action = "page.back"
label = "Back"

