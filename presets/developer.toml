action = "page.show"
target = "agents"
label = "Agents"

[[bindings]]
control = "button.upper_4"
gesture = "press"
action = "page.show"
target = "projects"
label = "Projects"

[[bindings]]
control = "button.upper_5"
gesture = "press"
action = "page.show"
target = "music"
label = "Music"

[[bindings]]
