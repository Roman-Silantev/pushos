# PushOS: a fleet of sixty-four.
#
# Every pad is an agent. The grid is the fleet: one glance says how many are
# running, which are working, and which have stopped and are waiting on you.
# You reach for the one that looks different; you never go looking for it.
#
# Why sixty-four is affordable. Codex hosts every thread in one process —
# measured on an M4, sixty-four of them share about 30 MB, against roughly
# 440 MB for a single Claude Code session. PushOS takes that path
# automatically for a `codex` provider with no `program` of its own.
#
# Why they do not all talk at once. Both vendors refuse past two or three
# simultaneous streaming turns. PushOS queues the rest rather than collecting
# failures, so an agent waiting its turn shows as queued rather than looking
# like it has gone wrong. A fleet is mostly agents waiting, the way a mixing
# desk is mostly channels nobody is touching.
#
# To use it:
#
#   1. Write your jobs, one a line, in ~/fleet-jobs.txt
#   2. Press Upper 1 to hire twenty agents
#   3. Press Upper 2 to give each of them the next job in the file
#   4. Watch the grid. Press whichever pad is asking for you.
#   5. Press Upper 8 to put them all away

[runtime]
home_page = "fleet"

[gestures]
hold_threshold_ms = 400
double_tap_window_ms = 280

[permissions]
granted = ["shell.execute"]

[sessions]
# The `mine` page mirrors terminals PushOS did not start, and nothing tells it
# when a window opens, so it asks. Three seconds is faster than you open
# windows and slower than the display is redrawn.
watch = true
poll_ms = 3000

[[pages]]
id = "fleet"
name = "Fleet"
description = "Sixty-four agents, one grid"

# The agents you are running yourself, in terminals PushOS did not start. A
# fleet is for work you hand out; these are the ones you are sitting with.
[[pages]]
id = "mine"
name = "Mine"
description = "The coding sessions you opened yourself"

[[providers]]
id = "codex"

[[agents]]
id = "worker"
name = "Worker"
objective = "Do the job you are given. Run the tests. Say what you did in one line."
preferred = ["codex"]
permissions = ["filesystem.read", "filesystem.write", "shell.execute"]

# --- Running the fleet --------------------------------------------------------
# The eight buttons above the display operate the fleet as a whole, because
# hiring twenty agents one pad at a time is twenty presses nobody wants to make.

[[bindings]]
control = "button.upper_1"
gesture = "press"
action = "fleet.hire"
label = "Hire 20"
params = { role = "worker", count = 20 }

[[bindings]]
control = "button.upper_2"
gesture = "press"
action = "fleet.brief"
label = "Brief"
params = { jobs = "~/fleet-jobs.txt" }

[[bindings]]
control = "button.upper_8"
gesture = "press"
action = "fleet.dismiss"
label = "Dismiss"

# Getting between the two pages. Global, so neither page can strand you on it.

[[bindings]]
control = "button.setup"
gesture = "press"
action = "page.show"
target = "fleet"
label = "Fleet"

[[bindings]]
control = "button.note"
gesture = "press"
action = "page.show"
target = "mine"
label = "Mine"

# Answering whichever agent is asking. A binding with no target acts on the
# selected one, so these four serve all sixty-four.

[[bindings]]
control = "button.lower_1"
gesture = "press"
action = "agent.approve"
label = "Allow"

[[bindings]]
control = "button.lower_2"
gesture = "press"
action = "agent.reject"
label = "Deny"

[[bindings]]
control = "button.stop"
gesture = "press"
action = "agent.cancel"
label = "Interrupt"

# --- The grid -----------------------------------------------------------------
# One pad per place in the fleet, counted from one in the order the agents
# opened. A place nobody is standing in stays dark, so the lit pads are the
# fleet and the dark ones are the room it has left to grow.
#
# Tap a pad to select that agent: the display shows what it is doing, and the
# Allow, Deny and Interrupt buttons then act on it. One tap to find out what an
# agent wants, one button to answer it.

