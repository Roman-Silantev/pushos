# --- Replying ----------------------------------------------------------------
# The row under the screen is what you say, and every one of them acts on
# whichever session you are reading, so eight buttons serve all of them.
#
# There are two kinds here and they are not the same. Yes, No and Continue type
# a line and submit it, which is how you answer a question. Accept, Enter, Up,
# Down and Dismiss press a single key and submit nothing, which is how you take
# what is being suggested and look at it before sending it.

[[bindings]]
control = "button.lower_1"
gesture = "press"
action = "session.send"
label = "Yes"
params = { text = "y\n" }

[[bindings]]
control = "button.lower_2"
gesture = "press"
action = "session.send"
label = "No"
params = { text = "n\n" }

[[bindings]]
control = "button.lower_3"
gesture = "press"
action = "session.send"
label = "Continue"
params = { text = "continue\n" }

[[bindings]]
control = "button.lower_4"
gesture = "press"
action = "session.press"
label = "Accept"
params = { key = "tab" }

[[bindings]]
control = "button.lower_5"
gesture = "press"
action = "session.press"
label = "Send"
params = { key = "enter" }

[[bindings]]
control = "button.lower_6"
gesture = "press"
action = "session.press"
label = "Up"
params = { key = "up" }

[[bindings]]
control = "button.lower_7"
gesture = "press"
action = "session.press"
label = "Down"
params = { key = "down" }

[[bindings]]
control = "button.lower_8"
gesture = "press"
action = "session.press"
label = "Dismiss"
params = { key = "escape" }
