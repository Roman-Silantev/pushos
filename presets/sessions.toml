# --- Replying ----------------------------------------------------------------
# There are two ways to reply and they are not the same. `session.send` types a
# line and submits it, which is how you answer a question. `session.press`
# presses a single key and submits nothing, which is how you accept what is
# being suggested: Tab takes it and leaves it there to read, and Enter sends it.

[[bindings]]
control = "pad.48"
gesture = "tap"
page = "answer"
action = "session.send"
label = "Yes"
params = { text = "y\n" }

[[bindings]]
control = "pad.49"
gesture = "tap"
page = "answer"
action = "session.send"
label = "No"
params = { text = "n\n" }

[[bindings]]
control = "pad.50"
gesture = "tap"
page = "answer"
action = "session.press"
label = "Enter"
params = { key = "enter" }

[[bindings]]
control = "pad.51"
gesture = "tap"
page = "answer"
action = "session.send"
label = "Continue"
params = { text = "continue\n" }

[[bindings]]
control = "pad.52"
gesture = "tap"
page = "answer"
action = "session.press"
label = "Accept"
params = { key = "tab" }

[[bindings]]
control = "pad.53"
gesture = "tap"
page = "answer"
action = "session.press"
label = "Send it"
params = { key = "enter" }

# Moving through a list of choices, for when a session is offering several.

[[bindings]]
control = "pad.54"
gesture = "tap"
page = "answer"
action = "session.press"
label = "Up"
params = { key = "up" }

[[bindings]]
control = "pad.55"
gesture = "tap"
page = "answer"
action = "session.press"
label = "Down"
params = { key = "down" }
