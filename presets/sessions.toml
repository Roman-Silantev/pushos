# PushOS: sessions
#
# The coding sessions you already have open, mapped across the whole
# instrument. PushOS did not start these and does not own them: a
# pseudo-terminal belongs to whoever created it. What it can do is watch them
# and type into them, which is most of what a surface is for.
#
# The first time you run this, macOS asks whether PushOS may control Terminal.
# Say yes; that permission is what makes all of this work, and `pushos doctor`
# reports on it.
#
# --- The map -----------------------------------------------------------------
#
#   Bottom row of pads       the eight sessions: tap to read one here
#   Row above the screen     jump to that window on the Mac
#   Row below the screen     what you say to it: yes, no, continue, accept,
#                            send, up, down, dismiss
#
# Each row has one job. The pads choose which session, the row above the screen
# takes you to it, and the row below says something to it.
#
#   Encoder 1                walk through the sessions, opening each
#   Encoder 2                move back through what one has said
#   Master encoder           volume
#
#   Up / Down                step through the sessions one at a time
#   Left / Right             move the eight in view, for more than eight
#   Page left / Page right   move between pages
#
#   Play                     play or pause music
#   Stop                     interrupt whichever session you are reading
#   New                      press Enter in it
#   Duplicate                accept what it is suggesting
#   Undo                     dismiss, which is Escape
#   Session                  back to the eight
#   Note                     the replies page
#   Setup                    what PushOS is doing
#
# Everything acting on "whichever session you are reading" means one control
# serves all of them, however many there are.

[runtime]
home_page = "sessions"

[permissions]
# Typing into a live session runs whatever it makes of the keystrokes, which is
# the same thing a terminal action does and needs the same saying yes to.
granted = ["shell.execute", "media.control"]

[sessions]
# Nothing tells PushOS when a window opens, so it asks. Three seconds is faster
# than you open windows and slower than the display is redrawn.
watch = true
poll_ms = 3000

[[pages]]
id = "sessions"
name = "Sessions"
description = "What each window is working on, and what it last said"

# --- Moving about ------------------------------------------------------------

[[bindings]]
control = "button.session"
gesture = "press"
action = "page.show"
target = "sessions"
label = "Sessions"

[[bindings]]
control = "button.page_right"
gesture = "press"
action = "page.next"
label = "Next page"

[[bindings]]
control = "button.page_left"
gesture = "press"
action = "page.previous"
label = "Previous page"

# --- More than eight ---------------------------------------------------------
# Eight pads, eight columns and eight buttons, because that is what the
# hardware has. With more sessions than that, these move which eight are in
# view; the pads keep their meaning and the display follows.

[[bindings]]
control = "button.right"
gesture = "press"
action = "session.bank"
label = "Next eight"
params = { by = 1 }

[[bindings]]
control = "button.left"
gesture = "press"
action = "session.bank"
label = "Previous eight"
params = { by = -1 }

# --- Browsing without looking at the pads ------------------------------------
# The first encoder walks through every open session, not just the eight in
# view, and opens each one as it arrives. The arrows do the same for a hand
# already on the buttons.

[[bindings]]
control = "encoder.1"
gesture = "turn_right"
action = "session.next"
label = "Next session"

[[bindings]]
control = "encoder.1"
gesture = "turn_left"
action = "session.previous"
label = "Previous session"

[[bindings]]
control = "button.down"
gesture = "press"
action = "session.next"
label = "Next session"

[[bindings]]
control = "button.up"
gesture = "press"
action = "session.previous"
label = "Previous session"

# The second encoder moves back and forward through what the session you are
# reading has said. The display says how far back you are.

[[bindings]]
control = "encoder.2"
gesture = "turn_left"
action = "session.scroll"
label = "Back"
params = { by = 1 }

[[bindings]]
control = "encoder.2"
gesture = "turn_right"
action = "session.scroll"
label = "Forward"
params = { by = -1 }

[[bindings]]
control = "encoder.master"
gesture = "turn_right"
action = "media.volume_up"
label = "Volume up"

[[bindings]]
control = "encoder.master"
gesture = "turn_left"
action = "media.volume_down"
label = "Volume down"

[[bindings]]
control = "button.play"
gesture = "press"
action = "media.play_pause"
label = "Play/Pause"

# --- Acting on whichever session you are reading ------------------------------
# One control each, serving all of them however many there are.

[[bindings]]
control = "button.stop"
gesture = "press"
action = "session.interrupt"
label = "Interrupt"

[[bindings]]
control = "button.new"
gesture = "press"
action = "session.press"
label = "Enter"
params = { key = "enter" }

[[bindings]]
control = "button.duplicate"
gesture = "press"
action = "session.press"
label = "Accept"
params = { key = "tab" }

[[bindings]]
control = "button.undo"
gesture = "press"
action = "session.press"
label = "Dismiss"
params = { key = "escape" }

[[bindings]]
control = "button.setup"
gesture = "press"
action = "session.show"
label = "What it said"

# --- Session 1 -----------------------------------------------------------------

# The pad reads it here. The button above the screen jumps to that window on
# the Mac, which is the thing the Push cannot do for you.

[[bindings]]
control = "pad.56"
gesture = "tap"
action = "session.show"
target = "slot:1"
label = "Session 1"

[[bindings]]
control = "pad.56"
gesture = "hold"
action = "session.select"
target = "slot:1"
label = "Select 1"

[[bindings]]
control = "button.upper_1"
gesture = "press"
action = "session.focus"
target = "slot:1"
label = "Go to 1"

