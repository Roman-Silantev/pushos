# --- Moving through them without looking -------------------------------------
# The leftmost encoder moves the eight the pads and the knobs stand for, so more
# than eight sessions are reachable without leaving the hand that is already on
# the knobs. The knob beside it moves a screenful through whichever session you
# are reading, which is what crossing a few hundred lines by hand wants. The
# arrows step one session at a time.

[[bindings]]
control = "encoder.tempo"
gesture = "turn_right"
action = "session.bank"
label = "Next eight"
params = { by = 1 }

[[bindings]]
control = "encoder.tempo"
gesture = "turn_left"
action = "session.bank"
label = "Previous eight"
params = { by = -1 }

[[bindings]]
control = "encoder.swing"
gesture = "turn_left"
action = "session.scroll"
label = "A screen back"
params = { by = 8 }

[[bindings]]
control = "encoder.swing"
gesture = "turn_right"
action = "session.scroll"
label = "A screen forward"
params = { by = -8 }

[[bindings]]
control = "button.down"
gesture = "press"
action = "session.next"
label = "Next session"

[[bindings]]
control = "button.up"
gesture = "press"
action = "session.previous"
label = "Previous session"

[[bindings]]
control = "encoder.master"
gesture = "turn_right"
action = "media.volume_up"
label = "Volume up"

[[bindings]]
control = "encoder.master"
gesture = "turn_left"
action = "media.volume_down"
label = "Volume down"

