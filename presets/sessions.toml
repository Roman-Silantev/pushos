# --- Answering ---------------------------------------------------------------
# Every one of these acts on whichever session you last selected, so one pad
# serves all eight.
#
# There are two ways to reply, and they are not the same thing. `session.send`
# types a line and submits it, which is how you answer a question. `session.press`
# presses a single key and submits nothing, which is how you accept what is
# being suggested: Tab takes the suggestion and leaves it there for you to look
# at, and Enter afterwards sends it.

[[bindings]]
control = "pad.0"
gesture = "tap"
page = "answer"
action = "session.send"
label = "Yes"
params = { text = "y\n" }

[[bindings]]
control = "pad.1"
gesture = "tap"
page = "answer"
action = "session.send"
label = "No"
params = { text = "n\n" }

[[bindings]]
control = "pad.2"
gesture = "tap"
page = "answer"
action = "session.send"
label = "Enter"
params = { text = "\n" }

[[bindings]]
control = "pad.3"
gesture = "tap"
page = "answer"
action = "session.send"
label = "Continue"
params = { text = "continue\n" }

# Accepting a suggested follow-up. Tab takes it, and the pad beside it sends
# it, so you can read what you are about to say before you say it.
[[bindings]]
control = "pad.4"
gesture = "tap"
page = "answer"
action = "session.press"
label = "Accept"
params = { key = "tab" }

[[bindings]]
control = "pad.5"
gesture = "tap"
page = "answer"
action = "session.press"
label = "Send it"
params = { key = "enter" }

# Moving through a list of choices, for when a session is offering several.
[[bindings]]
control = "pad.9"
gesture = "tap"
page = "answer"
action = "session.press"
label = "Up"
params = { key = "up" }

[[bindings]]
control = "pad.10"
gesture = "tap"
page = "answer"
action = "session.press"
label = "Down"
params = { key = "down" }

[[bindings]]
control = "pad.11"
gesture = "tap"
page = "answer"
action = "session.press"
label = "Dismiss"
params = { key = "escape" }

# Interrupting sends the control character, not the word, so a session waiting
# at a prompt is stopped rather than told about stopping. On a hold, because
# stopping something by brushing a pad would be worse than stopping it slowly.
[[bindings]]
control = "pad.7"
gesture = "hold"
page = "answer"
action = "session.interrupt"
label = "Interrupt"

[[bindings]]
control = "pad.8"
gesture = "tap"
page = "answer"
action = "session.show"
label = "What it said"

[[bindings]]
control = "button.upper_8"
gesture = "press"
page = "answer"
action = "page.back"
label = "Back"
