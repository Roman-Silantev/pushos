# PushOS: sessions
#
# The coding sessions you already have open, mapped across the whole
# instrument. PushOS did not start these and does not own them: a
# pseudo-terminal belongs to whoever created it. What it can do is watch them
# and type into them, which is most of what a surface is for.
#
# The first time you run this, macOS asks whether PushOS may control Terminal.
# Say yes; that permission is what makes all of this work, and `pushos doctor`
# reports on it.
#
# --- The map -----------------------------------------------------------------
#
#   Bottom row of pads       the eight sessions: tap to read one here
#   Row above the screen     jump to that window on the Mac
#   Row below the screen     what you say to it: yes, no, continue, accept,
#                            send, up, down, dismiss
#
# Each row has one job. The pads choose which session, the row above the screen
# takes you to it, and the row below says something to it.
#
#   The eight knobs          one per column: touch one to read that session,
#                            turn it to move through what it said
#   Tempo encoder            move the eight in view, for more than eight
#   Swing encoder            move a screenful back through the one you are reading
#   Master encoder           volume
#
#   Up / Down                step through the sessions one at a time
#   Left / Right             move the eight in view, for more than eight
#   Page left / Page right   move between pages
#
#   1/32t .. 1/4             jump straight to a bank of eight, 1 to 8
#
#   Record                   hold to dictate; let go and read it back
#   Select                   send what you dictated
#   Delete                   throw it away
#   Play                     play or pause music
#   Stop                     interrupt whichever session you are reading
#   New                      press Enter in it
#   Duplicate                accept what it is suggesting
#   Undo                     dismiss, which is Escape
#   Session                  back to the eight
#   Note                     the replies page
#   Setup                    what PushOS is doing
#
# Everything acting on "whichever session you are reading" means one control
# serves all of them, however many there are.

[runtime]
home_page = "sessions"

[permissions]
# Typing into a live session runs whatever it makes of the keystrokes, which is
# the same thing a terminal action does and needs the same saying yes to.
# Listening is its own capability, and only the verb that turns the microphone
# on needs it: stopping and discarding never do.
granted = ["shell.execute", "media.control", "microphone.listen"]

[voice]
# What a phrase that matches no command does with the words. `session.send`
# types them into whichever session you are reading, which is the point.
request = "session.send"

# And it waits for a press first. Typing into a live session is the one
# destination where hearing wrong costs something, so what it heard goes on the
# panel and Select sends it.
confirm_requests = true

[sessions]
# Nothing tells PushOS when a window opens, so it asks. Three seconds is faster
# than you open windows and slower than the display is redrawn.
watch = true
poll_ms = 3000

[[pages]]
id = "sessions"
name = "Sessions"
description = "What each window is working on, and what it last said"

# --- Moving about ------------------------------------------------------------

[[bindings]]
control = "button.session"
gesture = "press"
action = "page.show"
target = "sessions"
label = "Sessions"

[[bindings]]
control = "button.page_right"
gesture = "press"
action = "page.next"
label = "Next page"

[[bindings]]
control = "button.page_left"
gesture = "press"
action = "page.previous"
label = "Previous page"

# --- More than eight ---------------------------------------------------------
# Eight pads, eight columns and eight buttons, because that is what the
# hardware has. With more sessions than that, these move which eight are in
# view; the pads keep their meaning and the display follows.

[[bindings]]
control = "button.right"
gesture = "press"
action = "session.bank"
label = "Next eight"
params = { by = 1 }

[[bindings]]
control = "button.left"
gesture = "press"
action = "session.bank"
label = "Previous eight"
params = { by = -1 }

# --- The eight knobs above the screen ----------------------------------------
# Each one belongs to the column beneath it. That is what the display was laid
# out for and what Ableton's own screens do: the knob above a thing changes that
# thing, and you never have to work out which one you are holding.
#
# Resting a finger on a knob puts that session on the panel. Turning it moves
# back and forward through what that session said, a line at a time. So reading
# any of the eight is one hand and no pads.

[[bindings]]
control = "encoder.0"
gesture = "touch"
action = "session.show"
target = "slot:1"
label = "Session 1"

[[bindings]]
control = "encoder.0"
gesture = "turn_left"
action = "session.scroll"
target = "slot:1"
label = "Session 1 back"
params = { by = 1 }

[[bindings]]
control = "encoder.0"
gesture = "turn_right"
action = "session.scroll"
target = "slot:1"
label = "Session 1 forward"
params = { by = -1 }

[[bindings]]
control = "encoder.1"
gesture = "touch"
action = "session.show"
target = "slot:2"
label = "Session 2"

