# PushOS: sessions
#
# The coding sessions you already have open, on pads.
#
# PushOS did not start these and does not own them: a pseudo-terminal belongs
# to whoever created it. What it can do is watch them and type into them, which
# is most of what a pad is for. It reads each window's title, which for a
# coding agent is what that session is working on, so the screen shows eight
# real names rather than eight device numbers.
#
# The first time you run this, macOS asks whether PushOS may control Terminal.
# Say yes; that permission is what makes all of this work, and `pushos doctor`
# reports on it.

[runtime]
home_page = "sessions"

[permissions]
# Typing into a live session runs whatever it makes of the keystrokes, which is
# the same thing a terminal action does and needs the same saying yes to.
granted = ["shell.execute", "media.control"]

[sessions]
# Nothing tells PushOS when a window opens, so it asks. Three seconds is faster
# than you open windows and slower than the display is redrawn.
watch = true
poll_ms = 3000

[[pages]]
id = "sessions"
name = "Sessions"
description = "What each window is working on, and what it last said"

[[pages]]
id = "answer"
name = "Answer"
description = "Reply to whichever session you are looking at"

# --- Moving about ------------------------------------------------------------

[[bindings]]
control = "button.upper_1"
gesture = "press"
action = "page.show"
target = "sessions"
label = "Sessions"

[[bindings]]
control = "button.upper_2"
gesture = "press"
action = "page.show"
target = "answer"
label = "Answer"

[[bindings]]
control = "button.session"
gesture = "press"
action = "page.home"
label = "Home"

[[bindings]]
control = "button.play"
gesture = "press"
action = "media.play_pause"
label = "Play/Pause"

# --- One pad per window ------------------------------------------------------
# Eight pads on the bottom row, one per terminal device. A tap selects that
# session and puts the last few lines of it on the screen; a hold brings its
# window to the front.
#
# `tty:ttys000` is exact and stable for as long as that window is open. If you
# would rather name them by what they are working on, write the words instead:
#
#   target = "Sprint 2"
#
# which matches any session whose title contains them, and keeps working when
# the window moves to another device.

[[bindings]]
control = "pad.56"
gesture = "tap"
page = "sessions"
action = "session.show"
target = "tty:ttys000"
label = "ttys000"

[[bindings]]
control = "pad.56"
gesture = "hold"
page = "sessions"
action = "session.focus"
target = "tty:ttys000"
label = "Show window"

