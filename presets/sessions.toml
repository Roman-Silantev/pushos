# PushOS: sessions
#
# Eight coding sessions on eight pads, with what each one last said on the
# screen and the state of each in the light under your finger.
#
# One thing to know first: PushOS can only show you terminals it runs itself.
# It cannot attach to a window another application already opened, because the
# pseudo-terminal belongs to whoever created it. So these pads start the
# sessions, and from then on PushOS can see them.
#
# Change `cwd` on each pad to the project it belongs to, and `text` on the hold
# to whatever your test command is.

[runtime]
home_page = "sessions"

[permissions]
# Terminals run programs on your behalf, which is what this permission is.
granted = ["shell.execute", "media.control"]

[[pages]]
id = "sessions"
name = "Sessions"
description = "Eight coding sessions, and what each one last said"

[[pages]]
id = "tests"
name = "Tests"
description = "Run the tests in each session and watch them"

# --- Moving about ------------------------------------------------------------

[[bindings]]
control = "button.upper_1"
gesture = "press"
action = "page.show"
target = "sessions"
label = "Sessions"

[[bindings]]
control = "button.upper_2"
gesture = "press"
action = "page.show"
target = "tests"
label = "Tests"

[[bindings]]
control = "button.session"
gesture = "press"
action = "page.home"
label = "Home"

[[bindings]]
control = "button.play"
gesture = "press"
action = "media.play_pause"
label = "Play/Pause"

# --- The eight sessions ------------------------------------------------------
# Tap a pad to start that session, or to select it when it is already running.
# Hold it to stop it. The eight buttons below the screen select without
# starting, so you can read one without touching what it is doing.

[[bindings]]
control = "pad.56"
gesture = "tap"
page = "sessions"
action = "terminal.open"
label = "one"
params = { name = "one", program = "claude", cwd = "~/Projects/one" }

[[bindings]]
control = "pad.56"
gesture = "hold"
page = "sessions"
action = "terminal.close"
target = "name:one"
label = "Stop one"

[[bindings]]
control = "button.lower_1"
gesture = "press"
page = "sessions"
action = "terminal.select"
target = "name:one"
label = "one"

