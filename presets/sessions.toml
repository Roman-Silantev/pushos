# Answering a prompt in whichever session you selected, without reaching for
# the keyboard. `terminal.send` types exactly what it is given, so a lone
# newline answers a question and `y` agrees to one.

[[bindings]]
control = "button.upper_7"
gesture = "press"
action = "terminal.send"
target = "selected"
label = "Yes"
params = { text = "y\n" }

[[bindings]]
control = "button.upper_8"
gesture = "press"
action = "terminal.send"
target = "selected"
label = "Enter"
params = { text = "\n" }
