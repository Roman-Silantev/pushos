# --- Saying it instead of typing it -------------------------------------------
# Hold Record and talk. Let go and what it heard is on the panel, with the
# session it is aimed at still under it. Select sends it, Delete throws it away,
# and holding Record again replaces it: saying it twice is how you correct
# yourself.
#
# Nothing is typed into a live session by a transcription. The thing that
# finally types is a press, which is the same rule a spoken command follows.

[[bindings]]
control = "button.record"
gesture = "press"
action = "voice.listen"
label = "Hold to talk"

[[bindings]]
control = "button.record"
gesture = "release"
action = "voice.transcribe"
label = "Let go"

[[bindings]]
control = "button.select"
gesture = "press"
action = "voice.confirm"
label = "Send it"

[[bindings]]
control = "button.delete"
gesture = "press"
action = "voice.cancel"
label = "Throw it away"

[[bindings]]
control = "button.play"
gesture = "press"
action = "media.play_pause"
label = "Play/Pause"

# --- Acting on whichever session you are reading ------------------------------
# One control each, serving all of them however many there are.

[[bindings]]
control = "button.stop"
gesture = "press"
action = "session.interrupt"
label = "Interrupt"

[[bindings]]
control = "button.new"
gesture = "press"
action = "session.press"
label = "Enter"
params = { key = "enter" }

[[bindings]]
control = "button.duplicate"
gesture = "press"
action = "session.press"
label = "Accept"
params = { key = "tab" }

[[bindings]]
control = "button.undo"
gesture = "press"
action = "session.press"
label = "Dismiss"
params = { key = "escape" }

[[bindings]]
control = "button.setup"
gesture = "press"
action = "session.show"
label = "What it said"

