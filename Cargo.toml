[workspace]
resolver = "3"
members = ["crates/*"]
# Studio is a separate application with a heavy graphical toolchain. Keeping it
# out of the workspace means the core still builds and tests on a machine with
# no desktop libraries, which is what the hardware-free CI job checks.
exclude = ["studio/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/Roman-Silantev/pushos"
authors = ["Roman Silantev"]

[workspace.dependencies]
# Internal
pushos-domain = { path = "crates/pushos-domain" }
pushos-push2 = { path = "crates/pushos-push2" }
pushos-bindings = { path = "crates/pushos-bindings" }
pushos-actions = { path = "crates/pushos-actions" }
pushos-acp = { path = "crates/pushos-acp" }
pushos-agents = { path = "crates/pushos-agents" }
pushos-api = { path = "crates/pushos-api" }
pushos-ui = { path = "crates/pushos-ui" }
pushos-config = { path = "crates/pushos-config" }
pushos-storage = { path = "crates/pushos-storage" }
pushos-terminal = { path = "crates/pushos-terminal" }
pushos-memory = { path = "crates/pushos-memory" }
pushos-packs = { path = "crates/pushos-packs" }
pushos-voice = { path = "crates/pushos-voice" }
pushos-workflows = { path = "crates/pushos-workflows" }
pushos-workspaces = { path = "crates/pushos-workspaces" }
pushos-runtime = { path = "crates/pushos-runtime" }
pushos-macos = { path = "crates/pushos-macos" }
pushos-testkit = { path = "crates/pushos-testkit" }

# Async
tokio = { version = "1.53", default-features = false }
tokio-util = { version = "0.7", default-features = false }
async-trait = "0.1.92"
futures-util = { version = "0.3", default-features = false }

# Data
# `rc` lets typed ids share one allocation; ids are values, so loss of
# reference identity across a serialisation round trip is intended.
serde = { version = "1.0.229", features = ["derive", "rc"] }
toml = "1.1"
# Format-preserving TOML, so Studio can edit a hand-written configuration
# without discarding its comments and layout.
toml_edit = "0.25"
serde_json = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1.26", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["formatting", "macros"] }

# Hardware
midir = "0.11"
rusb = "0.9"
# Audio capture, for push to talk.
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
cpal = "0.18"

# macOS frameworks, reached without writing Objective-C.
objc2 = "0.6"
# Apple's framework crates default to binding every header in the framework,
# which for Foundation alone is over a hundred megabytes of generated code that
# PushOS never calls. Only the headers voice actually uses are switched on.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSError",
    "NSOperation",
    "NSString",
] }
objc2-speech = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-avf-audio",
    "SFSpeechRecognizer",
    "SFSpeechRecognitionRequest",
    "SFSpeechRecognitionResult",
    "SFSpeechRecognitionTask",
    "SFTranscription",
] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = [
    "std",
    "AVAudioApplication",
    "AVAudioBuffer",
    "AVAudioFormat",
    "AVAudioTypes",
] }
block2 = "0.6"
# Pseudo-terminals. PushOS runs jobs itself rather than opening windows, so it
# needs a real terminal a program will believe in.
portable-pty = "0.9"

# Rendering
tiny-skia = "0.12"
fontdue = "0.9"

# Observability + errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"

# Tooling
clap = { version = "4.6", features = ["derive"] }
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
arc-swap = "1.9"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Architectural guardrails from AGENTS.md
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "deny"
dbg_macro = "deny"
large_enum_variant = "warn"
mutex_atomic = "warn"

# Development builds are what grows on disk, not the shipped binary. Every test
# target links the whole dependency graph, and each one carried a copy of its
# debug data: that and incremental sessions are how a build directory reached
# tens of gigabytes. Measured on this workspace, a clean test build:
#
#   full debug information, incremental      2.7 GB
#   line tables only, incremental off         976 MB
#   no debug information, incremental off     785 MB
#
# Nothing is lost that a failing test needs. A panic's file, line and column
# are compiled into the panic itself, so they are printed without debug data;
# only a symbolicated backtrace loses its line numbers.
#
# Incremental compilation keeps the previous session of every crate beside the
# new one, so each rebuild roughly doubled what was on disk. Off, the directory
# stays the size of one build, and an edit to the domain crate at the bottom of
# the graph rebuilds in the same ten seconds either way.
[profile.dev]
debug = false
incremental = false

# Optimised for size. The renderer is the busiest code in PushOS and draws a
# frame in about 0.3 ms at this setting against 0.1 ms at full speed: thousands
# of frames a second either way, for a display that is sent a few dozen. What it
# buys is a binary 43% smaller, measured on this workspace:
#
#   opt-level 3, thin LTO    9.8 MB
#   opt-level z, fat LTO     5.6 MB
#
# in the same build time. Unwinding is kept: the MIDI, display and storage
# threads are allowed to fail without taking PushOS down, and `panic = "abort"`
# would turn each of those into a crash.
#
# A build with the optional Whisper engine does its arithmetic on this machine
# rather than asking macOS, and is worth building for speed instead:
#   CARGO_PROFILE_RELEASE_OPT_LEVEL=3 cargo build --release --features whisper
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
