[package]
name = "pushos-acp"
description = "The Agent Client Protocol adapter: PushOS's connection to Claude Code, Codex, and any other agent that speaks ACP over stdio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
pushos-domain = { workspace = true }
agent-client-protocol = "2.1"
async-trait = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
