[package]
name = "pushos-actions"
description = "The action dispatcher and the built-in action providers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
pushos-agents = { workspace = true }
pushos-domain = { workspace = true }
pushos-terminal = { workspace = true }
pushos-voice = { workspace = true }
pushos-workflows = { workspace = true }
pushos-workspaces = { workspace = true }
async-trait = { workspace = true }
# Only for `join_all`, which is what "run these all at once" means. `alloc` is
# what that one function needs; nothing here wants the rest of the crate.
futures-util = { workspace = true, features = ["alloc"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "time", "io-util", "rt", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
# The real note library rather than a fake: it is a directory of files, which
# is cheap to make and impossible to get subtly wrong on its behalf.
pushos-memory = { workspace = true }
pushos-storage = { workspace = true }
pushos-testkit = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
