[package]
name = "pushos-voice"
description = "Push to talk: capturing what the operator said, working it out on this Mac, and routing it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
pushos-domain = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time"] }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-speech = { workspace = true }
objc2-avf-audio = { workspace = true }
block2 = { workspace = true }

[dev-dependencies]
pushos-testkit = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
