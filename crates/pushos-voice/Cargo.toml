[package]
name = "pushos-voice"
description = "Push to talk: capturing what the operator said, working it out on this Mac, and routing it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
pushos-domain = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time"] }
tracing = { workspace = true }

candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-speech = { workspace = true }
objc2-avf-audio = { workspace = true, features = ["AVAudioApplication"] }
block2 = { workspace = true }

[features]
# Whisper, run locally through Metal. Off by default: macOS already has an
# engine that needs no download, and this one adds a hundred-odd crates and a
# model file the operator has to fetch themselves.
whisper = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:serde_json",
]

[dev-dependencies]
pushos-testkit = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
