[package]
name = "pushos-cli"
description = "The PushOS command line: run the runtime, validate configuration, diagnose hardware."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "pushos"
path = "src/main.rs"

[dependencies]
pushos-domain = { workspace = true }
pushos-config = { workspace = true }
pushos-push2 = { workspace = true }
pushos-runtime = { workspace = true }
pushos-storage = { workspace = true }
pushos-testkit = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
