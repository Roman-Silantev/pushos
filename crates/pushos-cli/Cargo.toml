[package]
name = "pushos-cli"
description = "The PushOS command line: run the runtime, validate configuration, diagnose hardware."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "pushos"
path = "src/main.rs"

[dependencies]
pushos-domain = { workspace = true }
pushos-actions = { workspace = true }
pushos-acp = { workspace = true }
pushos-agents = { workspace = true }
pushos-api = { workspace = true }
pushos-bindings = { workspace = true }
pushos-config = { workspace = true }
pushos-macos = { workspace = true }
pushos-memory = { workspace = true }
pushos-ui = { workspace = true }
pushos-push2 = { workspace = true }
pushos-runtime = { workspace = true }
pushos-storage = { workspace = true }
pushos-terminal = { workspace = true }
pushos-voice = { workspace = true }
pushos-workflows = { workspace = true }
pushos-workspaces = { workspace = true }
pushos-testkit = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
toml = { workspace = true }

[lints]
workspace = true
