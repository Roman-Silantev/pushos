# Sixty-four pads. Tap starts the role, hold selects it without starting it.
#
# Scoped to the pack's own page, so installing this cannot change what a control
# means anywhere you had already set up.
#
# The bottom row, pads 56 to 63, is left alone on purpose. That is where the
# terminals you already have open belong, and the `sessions` preset binds them.

