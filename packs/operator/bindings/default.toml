# --- Stopping one ------------------------------------------------------------
# Stop interrupts a terminal, which is Ctrl-C and leaves it sitting there. Mute
# ends a role PushOS started, which is a different thing and deserves its own
# button. On this page, because this is where the roles are.

[[bindings]]
control = "button.mute"
gesture = "press"
page = "operator"
action = "agent.stop"
label = "Stop the role"

# --- Getting back ------------------------------------------------------------
# A page that fills every pad has to say how to leave it, because no pad on it
# can.
#
# Getting *there* is deliberately not here. A pack binding a control outside its
# own pages would change what a surface you already set up does, which is not
# what installing something should mean. `pushos pack install` tells you the one
# line to add, and Device is the button it suggests.

[[bindings]]
control = "button.device"
gesture = "press"
page = "operator"
action = "page.back"
label = "Back"
