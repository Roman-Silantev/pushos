name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Documentation builds without warnings
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The whole core must build and be testable on a machine with no Push 2
  # attached and no agent provider installed.
  hardware-free:
    name: hardware-free core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install libusb for the Push 2 adapter
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev pkg-config
      - name: Core crates test without hardware
        run: >
          cargo test
          -p pushos-domain
          -p pushos-acp
          -p pushos-agents
          -p pushos-api
          -p pushos-bindings
          -p pushos-actions
          -p pushos-config
          -p pushos-storage
          -p pushos-ui
          -p pushos-runtime
          -p pushos-memory
          -p pushos-voice
          -p pushos-testkit

  # Studio is a separate application with its own toolchain, kept out of the
  # workspace so the core still builds on a machine with no desktop libraries.
  studio:
    name: studio
    runs-on: macos-14
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npm run check

      - name: Frontend builds
        run: npm run build

      - name: Backend formatting
        working-directory: studio/src-tauri
        run: cargo fmt --check

      - name: Backend lints
        working-directory: studio/src-tauri
        run: cargo clippy --all-targets

      - name: Backend builds
        working-directory: studio/src-tauri
        run: cargo build
