name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Documentation builds without warnings
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # What ships must stay small. PushOS starts at login and sits there all day
  # watching sixty-four pads, so its size is not an implementation detail; and
  # growth nobody measures is growth nobody argues with. These are ceilings,
  # not targets: when one is hit, either make it smaller or raise it in this
  # job, in a commit that says what was worth the room.
  lean:
    name: the app stays lean
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build what actually ships
        run: cargo build --release -p pushos-cli

      - name: Measure it
        run: |
          set -euo pipefail

          # Measured on an M4 in September 2026: 5 MB and 186 crates, running
          # at an 8 MB footprint. The ceilings leave room to work and still
          # catch a doubling.
          most_mb=8
          most_crates=220

          mb=$(( $(stat -f%z target/release/pushos) / 1024 / 1024 ))
          crates=$(cargo tree --workspace --edges normal --prefix none \
            | awk '{print $1}' | sort -u | wc -l | tr -d ' ')

          echo "binary: ${mb} MB (ceiling ${most_mb} MB)"
          echo "crates: ${crates} (ceiling ${most_crates})"

          if [ "$mb" -gt "$most_mb" ]; then
            echo "::error::what ships is ${mb} MB, past the ${most_mb} MB ceiling. Make it smaller, or raise the ceiling in this job and say what was worth it."
            exit 1
          fi
          if [ "$crates" -gt "$most_crates" ]; then
            echo "::error::the tree is ${crates} crates, past the ${most_crates} ceiling. Drop one, or raise the ceiling in this job and say what was worth it."
            exit 1
          fi

  # The whole core must build and be testable on a machine with no Push 2
  # attached and no agent provider installed.
  hardware-free:
    name: hardware-free core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install libusb for the Push 2 adapter
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev pkg-config
      - name: Core crates test without hardware
        run: >
          cargo test
          -p pushos-domain
          -p pushos-acp
          -p pushos-agents
          -p pushos-api
          -p pushos-bindings
          -p pushos-actions
          -p pushos-config
          -p pushos-storage
          -p pushos-ui
          -p pushos-runtime
          -p pushos-memory
          -p pushos-packs
          -p pushos-voice
          -p pushos-testkit

  # Studio is a separate application with its own toolchain, kept out of the
  # workspace so the core still builds on a machine with no desktop libraries.
  studio:
    name: studio
    runs-on: macos-14
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npm run check

      - name: Frontend builds
        run: npm run build

      - name: Backend formatting
        working-directory: studio/src-tauri
        run: cargo fmt --check

      - name: Backend lints
        working-directory: studio/src-tauri
        run: cargo clippy --all-targets

      # The app itself, built the way `npm run app` builds it: release settings,
      # unused commands removed, bundled and signed, none of which a
      # development build exercises.
      - name: App builds
        run: npm run tauri build -- --bundles app
