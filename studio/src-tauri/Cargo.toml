[package]
name = "pushos-studio"
description = "PushOS Studio: a configuration application for a running PushOS."
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/Roman-Silantev/pushos"
authors = ["Roman Silantev"]

# An ordinary Rust library, and nothing else. Tauri's template also builds it as
# a static and a dynamic library, which only iOS and Android load. Studio runs
# on the Mac, and the static copy alone was 121 MB, kept twice, in every
# development build.
[lib]
name = "pushos_studio"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
pushos-api = { path = "../../crates/pushos-api" }
pushos-config = { path = "../../crates/pushos-config" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11", features = [] }
tokio = { version = "1.53", features = ["sync"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Studio is its own Cargo project, kept out of the main workspace, and Cargo
# applies a workspace's profiles only to the packages inside it. So the build
# settings that keep PushOS's build directory small have to be stated again
# here, or Studio's development builds keep full debug information and every
# old incremental session: its build directory had reached 3.8 GB.
#
# Nothing a failing build needs is lost. A panic's file, line and column are
# compiled into the panic itself; only a symbolicated backtrace loses its line
# numbers. See the main Cargo.toml for the measurements behind both settings.
[profile.dev]
debug = false
incremental = false

# Studio's release build is the app people open, so it is built for size, the
# way Tauri's guide recommends. Nearly everything Studio draws is drawn by the
# system's web view; the Rust half passes requests to PushOS and back, which is
# too little work for the optimisation level to be noticed.
#
# Unwinding is kept, as in PushOS: a command that panics ends that command,
# where `panic = "abort"` would close Studio and whatever was being edited.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
